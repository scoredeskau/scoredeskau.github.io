<!DOCTYPE html>
<html lang="en" class="no-transitions">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 RSYLTC Clay Court Championships</title>
    <link rel="stylesheet" href="navbar.css">
    
    <script>
        window.PAGE_THEME = 'theme-australian';
        window.PAGE_PRIMARY_TITLE = '2026 RSYLTC Clay Court Championships';
        window.PAGE_SECONDARY_TITLE = 'Admin';

        window.PAGE_NAVIGATION_ITEMS = [
            { label: 'Live', target: '#live' },
            { label: 'Scheduled', target: '#scheduled' },
            { label: 'Completed', target: '#completed' },
            { label: 'Streams', target: '#streams' },
            { label: 'Draws', target: '#draws' },
            { label: 'Announcements', target: '#announcements' },
            { label: 'Settings', target: '#settings' }
        ];
    </script>
    <script src="anti-flash.js"></script>
    <script src="navbar.js" defer></script>
</head>
<body>

    <div class="navigation-container" id="navContainer"></div>

    <main class="main-content">
        <section id="live" class="tab-view">
            <h1>Live</h1>
        </section>
        <section id="scheduled" class="tab-view">
            <h1>Scheduled</h1>
        </section>
        <section id="completed" class="tab-view">
            <h1>Completed</h1>
        </section>
        <section id="streams" class="tab-view">
            <h1>Streams</h1>
        </section>
        <section id="draws" class="tab-view">
            <h1>Draws</h1>
        </section>
        <section id="announcements" class="tab-view">
            <h1>Announcements</h1>
        </section>
        <section id="settings" class="tab-view">
            <h1>Settings</h1>
        </section>

</html>
