        /**
         * Calculates tournament status dynamically based on today's local date.
         * Expects date string format: "MMM DD - MMM DD, YYYY" (e.g. "Sep 28 - Oct 1, 2026")
         */
        function getTournamentStatus(dateStr) {
            const match = dateStr.match(/^([A-Za-z]+)\s+(\d+)\s*-\s*([A-Za-z]+)\s+(\d+),\s*(\d{4})$/);
            if (!match) return 'upcoming';

            const [, startMonthStr, startDayStr, endMonthStr, endDayStr, yearStr] = match;

            const year = parseInt(yearStr, 10);
            const startDay = parseInt(startDayStr, 10);
            const endDay = parseInt(endDayStr, 10);

            const monthMap = {
                jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5,
                jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11
            };

            const startMonth = monthMap[startMonthStr.slice(0, 3).toLowerCase()];
            const endMonth = monthMap[endMonthStr.slice(0, 3).toLowerCase()];

            if (startMonth === undefined || endMonth === undefined) return 'upcoming';

            let startYear = year;
            // Handle cross-year ranges (e.g. Dec 28 - Jan 4, 2027)
            if (startMonth > endMonth) {
                startYear = year - 1;
            }

            // Midnight start of start day and midnight end of end day
            const startDate = new Date(startYear, startMonth, startDay, 0, 0, 0, 0);
            const endDate = new Date(year, endMonth, endDay, 23, 59, 59, 999);

            const now = new Date();

            if (now < startDate) {
                return 'upcoming';
            } else if (now > endDate) {
                return 'completed';
            } else {
                return 'live';
            }
        }

        function renderTournamentCards(items) {

            if (!container) return;

            container.innerHTML = items.map(item => {

                return `
                    <a href="javascript:void(0);" class="card portal-card" onclick="event.preventDefault();">
                        <div class="card-header">
                            <h2 class="card-title">${item.title}</h2>
                        </div>
                        <div class="card-body">
                            <div class="card-info-row card-location">
                                <span>${item.location}</span>
                            </div>
                            <div class="card-footer-row">
                                <div class="card-info-row card-date">
                                    <span>${item.date}</span>
                                </div>
                                <span class="status-pill status-${status}">
                                    ${status === 'live' ? '<span class="live-dot"></span>LIVE' : status.toUpperCase()}
                                </span>
                            </div>
                        </div>
                    </a>
                `;
            }).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderTournamentCards(tournamentData);
        });
    </script>
</body>
</html>
