    <div class="navigation-container" id="navContainer"></div>

    <main class="main-content">

        <!-- Tournaments Tab -->
        <section id="tournaments" class="tab-view is-active">
            <div class="section-header">
                <h1>Tournaments</h1>
                <div class="section-actions">
                    <button class="action-button" aria-label="Add Tournament">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span>Add</span>
                    </button>
                    <button class="action-button" aria-label="Sort Tournaments">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m21 16-4 4-4-4M17 20V4M3 8l4-4 4 4M7 4v16"></path>
                        </svg>
                        <span>Sort</span>
                    </button>
                    <button class="action-button" aria-label="Filter Tournaments">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                        </svg>
                        <span>Filter</span>
                    </button>
                    <button class="action-button" aria-label="Export Tournaments">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        <span>Export</span>
                    </button>
                </div>
                <p class="section-subtitle">Track your active registrations, entry status, seedings, and historical match performance in official events.</p>
            </div>

            <!-- Dynamic Adaptive Tournament Grid -->
            <div class="portal-grid" id="tournamentGrid"></div>
        </section>

        <!-- Favourites Tab -->
        <section id="favourites" class="tab-view">
            <div class="section-header">
                <h1>Favourites</h1>
                <p class="section-subtitle">Manage your saved tournaments, players, and bookmarked events.</p>
            </div>
        </section>

        <!-- Settings Tab -->
        <section id="settings" class="tab-view">
            <div class="section-header">
                <h1>Settings</h1>
                <p class="section-subtitle">Adjust your user preferences, notification choices, and display themes.</p>
            </div>
        </section>

    </main>

        function renderTournamentCards(items) {
            const container = document.getElementById('tournamentGrid');
            if (!container) return;

            container.innerHTML = items.map(item => `
                <a href="javascript:void(0);" class="card portal-card" onclick="event.preventDefault();">
                    <div class="card-header">
                        <h2 class="card-title">${item.title}</h2>
                    </div>
                    <div class="card-body">
                        <div class="card-info-row card-location">
                            <span>${item.location}</span>
                        </div>
                        <div class="card-footer-row">
                            <div class="card-info-row card-date">
                                <span>${item.date}</span>
                            </div>
                            <span class="status-pill status-${item.status}">
                                ${item.status === 'live' ? '<span class="live-dot"></span>LIVE' : item.status.toUpperCase()}
                            </span>
                        </div>
                    </div>
                </a>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderTournamentCards(tournamentData);
        });
