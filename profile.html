        function renderTournamentCards(items) {
            const container = document.getElementById('tournamentGrid');
            if (!container) return;

            container.innerHTML = items.map(item => `
                <a href="javascript:void(0);" class="card portal-card" onclick="event.preventDefault();">
                    <div class="card-header">
                        <h2 class="card-title">${item.title}</h2>
                    </div>
                    <div class="card-body">
                        <div class="card-info-row card-location">
                            <span>${item.location}</span>
                        </div>
                        <div class="card-footer-row">
                            <div class="card-info-row card-date">
                                <span>${item.date}</span>
                            </div>
                            <span class="status-pill status-${item.status}">
                                ${item.status === 'live' ? '<span class="live-dot"></span>LIVE' : item.status.toUpperCase()}
                            </span>
                        </div>
                    </div>
                </a>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderTournamentCards(tournamentData);
        });
