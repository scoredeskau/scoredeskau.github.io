            const match = dateStr.match(/^([A-Za-z]+)\s+(\d+)\s*-\s*([A-Za-z]+)\s+(\d+),\s*(\d{4})$/);
            if (!match) return 'upcoming';

            const [, startMonthStr, startDayStr, endMonthStr, endDayStr, yearStr] = match;

            const endYear = parseInt(yearStr, 10);
            const startDay = parseInt(startDayStr, 10);
            const endDay = parseInt(endDayStr, 10);

            const monthMap = {
                jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5,
                jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11
            };

            const startMonth = monthMap[startMonthStr.slice(0, 3).toLowerCase()];
            const endMonth = monthMap[endMonthStr.slice(0, 3).toLowerCase()];

            if (startMonth === undefined || endMonth === undefined) return 'upcoming';

            const startYear = (startMonth > endMonth) ? endYear - 1 : endYear;

            const startDate = new Date(startYear, startMonth, startDay, 0, 0, 0, 0);
            const endDate = new Date(endYear, endMonth, endDay, 23, 59, 59, 999);

            const now = new Date();

            if (now < startDate) {
                return 'upcoming';
            } else if (now > endDate) {
                return 'completed';
            } else {
                return 'live';
            }
        }

        function renderTournamentCards(items) {
            const container = document.getElementById('tournamentGrid');
            if (!container) return;

            container.innerHTML = items.map(item => {
                const status = getTournamentStatus(item.date);

                return `
                    <a href="javascript:void(0);" class="card portal-card" onclick="event.preventDefault();">
                        <div class="card-header">
                            <h2 class="card-title">${item.title}</h2>
                        </div>
                        <div class="card-body">
                            <div class="card-info-row card-location">
                                <span>${item.location}</span>
                            </div>
                            <div class="card-footer-row">
                                <div class="card-info-row card-date">
                                    <span>${item.date}</span>
                                </div>
                                <span class="status-pill status-${status}">
                                    ${status === 'live' ? '<span class="live-dot"></span>LIVE' : status.toUpperCase()}
                                </span>
                            </div>
                        </div>
                    </a>
                `;
            }).join('');
        }

        function renderFavouritesCards(items) {
            const container = document.getElementById('favouritesGrid');
            if (!container) return;

            container.innerHTML = items.map(item => {
                if (item.type === 'tournament') {
                    return `
                        <a href="javascript:void(0);" class="card portal-card" onclick="event.preventDefault();">
                            <div class="card-header">
                                <h2 class="card-title">${item.title}</h2>
                            </div>
                            <div class="card-body">
                                <div class="card-info-row card-location">
                                    <span>${item.location}</span>
                                </div>
                                <div class="card-footer-row">
                                    <div class="card-info-row card-date">
                                        <span>${item.date}</span>
                                    </div>
                                    <span class="status-pill status-tournament">TOURNAMENT</span>
                                </div>
                            </div>
                        </a>
                    `;
                } else if (item.type === 'player') {
                    return `
                        <a href="javascript:void(0);" class="card portal-card" onclick="event.preventDefault();">
                            <div class="card-header">
                                <h2 class="card-title">${item.title}</h2>
                            </div>
                            <div class="card-body">
                                <div class="card-info-row card-utr">
                                    <span>${item.utr}</span>
                                </div>
                                <div class="card-footer-row">
                                    <div class="card-info-row card-winloss">
                                        <span>${item.winLoss}</span>
                                    </div>
                                    <span class="status-pill status-player">PLAYER</span>
                                </div>
                            </div>
                        </a>
                    `;
                } else if (item.type === 'match') {
                    const scores1 = item.scores1 || [
                        { val: "30", bold: false },
                        { val: "6", bold: true },
                        { val: "5", bold: false },
                        { val: "4", bold: false }
                    ];
                    const scores2 = item.scores2 || [
                        { val: "40", bold: false },
                        { val: "0", bold: false },
                        { val: "7", bold: true },
                        { val: "5", bold: false }
                    ];

                    const p1IconClass = (item.server === 1 || item.server === 'p1' || item.server === 'top') ? 'card-ball' : 'card-empty-icon';
                    const p2IconClass = (item.server === 1 || item.server === 'p1' || item.server === 'top') ? 'card-empty-icon' : 'card-ball';

                    return `
                        <a href="javascript:void(0);" class="card portal-card" onclick="event.preventDefault();">
                            <div class="card-header">
                                <h2 class="card-title">${item.title}</h2>
                            </div>
                            <div class="card-body">
                                <div class="card-info-row ${p1IconClass}">
                                    <span class="player-name">${item.player1}</span>
                                    <div class="match-scores">
                                        ${scores1.map(s => `<span class="score-col ${s.bold ? 'score-bold' : ''}">${s.val}</span>`).join('')}
                                    </div>
                                </div>
                                <div class="card-info-row ${p2IconClass}">
                                    <span class="player-name">${item.player2}</span>
                                    <div class="match-scores">
                                        ${scores2.map(s => `<span class="score-col ${s.bold ? 'score-bold' : ''}">${s.val}</span>`).join('')}
                                    </div>
                                </div>
                                <div class="card-footer-row">
                                    <div class="card-info-row card-match-info">
                                        <span>${item.matchInfo}</span>
                                    </div>
                                    <span class="status-pill status-match">MATCH</span>
                                </div>
                            </div>
                        </a>
                    `;
                }
                return '';
            }).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderTournamentCards(tournamentData);
            renderFavouritesCards(favouritesData);
        });
    </script>
</body>
</html>
